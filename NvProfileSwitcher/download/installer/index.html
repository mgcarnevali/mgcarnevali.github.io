<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Downloading NvProfileSwitcher — Installer</title>
<style>
:root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #0b1110; color: #e6f0e9; }
main { text-align: center; max-width: 35rem; padding: 2rem; }
a { color: #7ee0a5; }
p { line-height: 1.6; color: #b5c4ba; }
</style>
</head>
<body>
<main>
<h1>Preparing your installer download…</h1>
<p id="status" role="status">Finding the latest stable release on GitHub.</p>
<p><a id="fallback" href="https://github.com/mgcarnevali/NvProfileSwitcher/releases/latest">Open the latest release manually</a></p>
</main>
<script>
(async () => {
  const status = document.getElementById('status');
  const fallback = document.getElementById('fallback');
  try {
    const response = await fetch('https://api.github.com/repos/mgcarnevali/NvProfileSwitcher/releases/latest', {
      headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store'
    });
    if (!response.ok) throw new Error('GitHub API returned ' + response.status);
    const release = await response.json();
    const assets = Array.isArray(release.assets) ? release.assets : [];
    const match = assets.find(asset => {
      if (!asset || typeof asset.name !== 'string') return false;
      if (asset.name.toLowerCase().endsWith('.sha256')) return false;
      return /^NvProfileSwitcher-Setup-v[0-9]+(?:\.[0-9]+)*\.exe$/i.test(asset.name);
    });
    if (!match || !/^https:\/\/github\.com\/mgcarnevali\/NvProfileSwitcher\/releases\/download\//i.test(match.browser_download_url || '')) {
      throw new Error('Matching download asset not found');
    }
    status.textContent = 'Redirecting to ' + match.name + '…';
    fallback.href = match.browser_download_url;
    fallback.textContent = 'Download ' + match.name + ' manually';
    window.location.replace(match.browser_download_url);
  } catch (error) {
    status.textContent = 'Automatic download unavailable. Use the link below to choose the file on GitHub Releases.';
  }
})();
</script>
</body>
</html>
